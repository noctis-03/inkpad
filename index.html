<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inkpad" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Inkpad</title>
    <script>
      // 첫 페인트 전에 모션 단계와 테마를 정해 깜빡임을 막는다.
      // 설정은 localStorage(동기)에 있으므로 저장된 값을 그대로 읽을 수 있다.
      // 앱이 뜨면 App.tsx 가 다시 계산해 덮어쓴다(시스템 외관 변경·설정 변경 반영).
      (function () {
        var root = document.documentElement
        try {
          root.dataset.motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'normal'
        } catch (e) {
          root.dataset.motion = 'normal'
        }
        try {
          var theme = 'auto'
          var raw = localStorage.getItem('inkpad.settings.v2')
          if (raw) {
            var s = JSON.parse(raw)
            if (s && (s.theme === 'light' || s.theme === 'dark')) theme = s.theme
          }
          if (theme === 'auto') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          root.dataset.theme = theme
        } catch (e) {
          root.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
