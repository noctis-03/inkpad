<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inkpad" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161513" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Inkpad</title>
    <script>
      // 첫 페인트 전에 모션 단계와 테마를 정해 깜빡임을 막는다.
      // 설정은 localStorage(동기)에 있으므로 저장된 값을 그대로 읽을 수 있다.
      // 앱이 뜨면 App.tsx 가 다시 계산해 덮어쓴다(시스템 외관 변경·설정 변경 반영).
      (function () {
        var root = document.documentElement
        try {
          root.dataset.motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'normal'
        } catch (e) {
          root.dataset.motion = 'normal'
        }
        try {
          var theme = 'auto'
          var raw = localStorage.getItem('inkpad.settings.v2')
          if (raw) {
            var s = JSON.parse(raw)
            if (s && (s.theme === 'light' || s.theme === 'dark')) theme = s.theme
          }
          if (theme === 'auto') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          root.dataset.theme = theme
          // 밀도 — 첫 화면부터 맞춘다(앱이 뜬 뒤 크기가 바뀌어 보이지 않게). 기본은 넉넉하게
          root.dataset.density = s && s.density === 'compact' ? 'compact' : 'comfortable'
        } catch (e) {
          root.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      /* 시작 화면 — 앱 코드가 내려받아지기 전에 뜬다. 노트 카드 → 줄 → 파란 획(앱 아이콘)이 그려지고 'Inkpad'가 떠오른다.
         앱이 준비되고 모션 한 번(약 1.2초)이 끝나면 사라진다 (src/main.tsx가 __inkpadReady를 부른다) */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f6f2;
        transition: opacity 0.38s ease, transform 0.38s ease;
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }
      #splash svg {
        width: 112px;
        height: 112px;
        overflow: visible;
      }
      #splash .sp-card {
        fill: #ffffff;
        stroke: #dcd8d0;
        stroke-width: 1.9;
        transform-origin: 60px 60px;
        animation: sp-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #splash .sp-line {
        stroke: #e1e6ef;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: sp-draw 0.2s ease-out forwards;
      }
      #splash .sp-wave {
        fill: none;
        stroke: #2f62e0;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation:
          sp-draw 0.55s cubic-bezier(0.65, 0, 0.35, 1) 0.48s forwards,
          sp-breathe 1.1s ease-in-out 1.25s infinite alternate;
      }
      #splash .sp-word {
        font: 700 22px/1 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
        letter-spacing: -0.02em;
        color: #23211d;
        opacity: 0;
        transform: translateY(6px);
        animation: sp-rise 0.36s ease-out 0.82s forwards;
      }
      @keyframes sp-pop {
        from { opacity: 0; transform: scale(0.86); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sp-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sp-breathe {
        to { opacity: 0.55; }
      }
      @keyframes sp-rise {
        to { opacity: 1; transform: none; }
      }
      [data-theme='dark'] #splash { background: #161513; }
      [data-theme='dark'] #splash .sp-card { fill: #22211e; stroke: #3a3833; }
      [data-theme='dark'] #splash .sp-line { stroke: #34394a; }
      [data-theme='dark'] #splash .sp-wave { stroke: #8aa6ff; }
      [data-theme='dark'] #splash .sp-word { color: #ebe8e2; }
      /* 동작 줄이기 — 움직임 없이 로고만 */
      [data-motion='off'] #splash *,
      [data-motion='off'] #splash {
        animation: none !important;
        transition: none !important;
      }
      [data-motion='off'] #splash .sp-line,
      [data-motion='off'] #splash .sp-wave { stroke-dashoffset: 0; }
      [data-motion='off'] #splash .sp-word { opacity: 1; transform: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <rect class="sp-card" x="17.6" y="17.6" width="84.8" height="84.8" rx="11" />
        <line class="sp-line" x1="28.8" y1="41" x2="91.2" y2="41" pathLength="1" style="animation-delay: 0.22s" />
        <line class="sp-line" x1="28.8" y1="55.3" x2="91.2" y2="55.3" pathLength="1" style="animation-delay: 0.28s" />
        <line class="sp-line" x1="28.8" y1="69.6" x2="91.2" y2="69.6" pathLength="1" style="animation-delay: 0.34s" />
        <line class="sp-line" x1="28.8" y1="83.9" x2="91.2" y2="83.9" pathLength="1" style="animation-delay: 0.4s" />
        <path class="sp-wave" d="M31 65.5 C35.5 71 40 77.5 46 77.2 C54 76.8 60 52.6 69 52.8 C77 53 83.5 65 88.8 72.6" pathLength="1" />
      </svg>
      <div class="sp-word">Inkpad</div>
    </div>
    <script>
      // 시작 화면 닫기 — 앱이 준비됐다고 알리면(main.tsx), 모션 한 번(1.2초)은 다 보인 뒤에 사라진다.
      // 자동화된 브라우저(테스트)는 기다리지 않게 바로 치운다(?splash 를 붙이면 그대로 보인다). 앱이 끝내 안 뜨면 8초 뒤 치운다
      ;(function () {
        var el = document.getElementById('splash')
        if (!el) return
        var t0 = performance.now()
        var MIN = document.documentElement.dataset.motion === 'off' ? 450 : 1200
        var gone = false
        function hide() {
          if (gone) return
          gone = true
          el.classList.add('out')
          setTimeout(function () { el.remove() }, 420)
        }
        if (navigator.webdriver && !/[?&]splash\b/.test(location.search)) return void el.remove()
        window.__inkpadReady = function () {
          setTimeout(hide, Math.max(0, MIN - (performance.now() - t0)))
        }
        setTimeout(hide, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
