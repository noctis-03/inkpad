<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inkpad" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Inkpad</title>
    <script>
      // 첫 페인트 전에 모션 단계를 정해 깜빡임을 막는다.
      // 저장된 설정은 IndexedDB(비동기)에 있으므로 여기서는 OS '동작 줄이기'만 우선 반영하고,
      // 앱이 뜨면 App.tsx 가 저장된 설정으로 덮어쓴다.
      (function () {
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          document.documentElement.dataset.motion = reduce ? 'off' : 'normal'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
