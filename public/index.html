<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandNote — 손글씨 노트</title>
<meta name="description" content="펜으로 쓰는 손글씨 노트. 브라우저에 저장하고 구글 드라이브로 동기화합니다.">
<meta name="theme-color" content="#EDE9DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="icon" href="./assets/icon-192.png">
<style>
/* ─────────────────────────────────────────────────────────────
   HandNote design tokens — "공책 위의 잉크" (ink on ruled paper)
   ───────────────────────────────────────────────────────────── */
:root{
  --desk:#EDE9DF; --desk-2:#E4DFD3;
  --panel:#FBF9F4; --panel-2:#F4F1E9; --panel-3:#EDEAE0;
  --paper:#FFFFFF; --paper-warm:#FBF7EE; --paper-dark:#262320;
  --rule:#C9D3E2; --rule-strong:#B7C4D8;
  --margin-rule:#D2503C;
  --line:#DCD6C9; --line-soft:#E8E3D8;
  --ink:#1B1A17; --ink-2:#55504A; --ink-3:#8C8578; --ink-4:#B3AC9E;
  --accent:#1F5FD0; --accent-soft:#E4ECFB; --accent-ink:#123C86;
  --ok:#2E7D5B; --warn:#B7791F; --danger:#C0392B;
  --shadow-1:0 1px 2px rgba(28,25,20,.07), 0 1px 1px rgba(28,25,20,.04);
  --shadow-2:0 2px 4px rgba(28,25,20,.07), 0 14px 32px -14px rgba(28,25,20,.4);
  --shadow-3:0 3px 8px rgba(28,25,20,.10), 0 28px 60px -22px rgba(28,25,20,.5);
  --r-1:6px; --r-2:10px; --r-3:14px; --r-4:20px;
  --font-ui:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-display:ui-serif,"Iowan Old Style","Apple SD Gothic Neo","Nanum Myeongjo","Batang",Georgia,serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --hdr-h:52px; --tray-h:104px; --side-w:256px; --rail-w:60px;
  --ease:cubic-bezier(.22,.68,.32,1);
}
[data-theme="dark"]{
  --desk:#131211; --desk-2:#0C0B0A;
  --panel:#1C1A18; --panel-2:#232120; --panel-3:#2A2725;
  --paper:#26231F; --paper-warm:#2B2721; --paper-dark:#1A1816;
  --rule:#3D3A34; --rule-strong:#4A463F;
  --margin-rule:#C9634F;
  --line:#37332D; --line-soft:#2B2823;
  --ink:#F1EDE4; --ink-2:#B3ACA1; --ink-3:#867F74; --ink-4:#5E594F;
  --accent:#7BA6FF; --accent-soft:#1D2942; --accent-ink:#A8C4FF;
  --ok:#5FB893; --warn:#D9A341; --danger:#E37373;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.35), 0 14px 32px -14px rgba(0,0,0,.7);
  --shadow-3:0 3px 8px rgba(0,0,0,.4), 0 28px 60px -22px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--desk); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
body[data-dragging="1"]{cursor:grabbing}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── layout ───────────────────────────────────────────────── */
.app{
  display:grid; height:100dvh;
  grid-template-columns:var(--side-w) 1fr var(--rail-w);
  grid-template-rows:var(--hdr-h) 1fr var(--tray-h);
  grid-template-areas:"hdr hdr hdr" "side stage rail" "tray tray tray";
  background:var(--desk);
}
body.side-collapsed .app{grid-template-columns:0 1fr var(--rail-w)}
body.tray-hidden .app{grid-template-rows:var(--hdr-h) 1fr 0;--tray-h:0px}

/* ── header ───────────────────────────────────────────────── */
.hdr{
  grid-area:hdr; display:flex; align-items:center; gap:14px; padding:0 12px 0 14px;
  background:linear-gradient(var(--panel),var(--panel-2));
  border-bottom:1px solid var(--line); position:relative; z-index:40;
}
.brand{display:flex; align-items:center; gap:9px; user-select:none; flex:0 0 auto}
.brand .mark{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;
  background:var(--ink); border-radius:8px; box-shadow:var(--shadow-1)}
.brand .mark svg{width:16px;height:16px;stroke:var(--panel);fill:none;stroke-width:1.7}
.brand .word{font-family:var(--font-display); font-size:19px; letter-spacing:.055em; font-weight:600; line-height:1}
.brand .word i{font-style:normal;opacity:.42;font-weight:400}
.hdr-sep{width:1px;height:22px;background:var(--line);flex:0 0 1px}
.nb-switch{
  display:flex;align-items:center;gap:9px;max-width:340px;min-width:0;
  padding:5px 10px 5px 8px;border-radius:var(--r-2);border:1px solid transparent;
}
.nb-switch:hover{background:var(--panel-3);border-color:var(--line-soft)}
.nb-switch .spine{width:4px;height:20px;border-radius:2px;background:var(--accent);flex:0 0 4px}
.nb-switch .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-switch .c{width:14px;height:14px;color:var(--ink-3);flex:0 0 14px}
.hdr-spacer{flex:1 1 auto}
.hdr .actions{display:flex;align-items:center;gap:3px}
.ebrow{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
}

/* ── buttons ──────────────────────────────────────────────── */
.ibtn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  transition:background .13s var(--ease), color .13s var(--ease), transform .13s var(--ease);
  position:relative;
}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{background:var(--panel-3);color:var(--ink)}
.ibtn:active{transform:scale(.94)}
.ibtn[aria-pressed="true"],.ibtn.is-on{background:var(--ink);color:var(--panel)}
.ibtn[disabled]{opacity:.32;pointer-events:none}
.ibtn.sm{width:28px;height:28px;border-radius:7px}
.ibtn.sm svg{width:15px;height:15px}
.ibtn .badge{
  position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);border:1.5px solid var(--panel);
}
.ibtn .badge.warn{background:var(--warn)} .ibtn .badge.err{background:var(--danger)}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-2);
  border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:13px; font-weight:550;
  box-shadow:var(--shadow-1); transition:.13s var(--ease); white-space:nowrap;
}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--panel-2);border-color:var(--ink-4)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover{background:#000}
[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#0B0F18}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--panel-3)}
.btn.wide{width:100%;justify-content:center}
.btn.sm{height:29px;padding:0 10px;font-size:12px}

/* ── sidebar ──────────────────────────────────────────────── */
.side{
  grid-area:side; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-width:0; overflow:hidden;
}
body.side-collapsed .side{display:none}
.side-hd{padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px}
.side-hd .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.7;pointer-events:none}
.search input{
  width:100%;height:32px;padding:0 9px 0 30px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2); font-size:13px;
}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.side-list{flex:1 1 auto;overflow-y:auto;padding:4px 8px 14px;display:flex;flex-direction:column;gap:2px}
.nb-row{
  display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--r-2);text-align:left;
  border:1px solid transparent; position:relative; width:100%;
}
.nb-row:hover{background:var(--panel-2)}
.nb-row.on{background:var(--panel-3);border-color:var(--line)}
.nb-row.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nb-row .cover{width:26px;height:34px;border-radius:3px 6px 6px 3px;flex:0 0 26px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14), var(--shadow-1); overflow:hidden}
.nb-row .cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.22)}
.nb-row .cover span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);
  font-size:11px;color:rgba(255,255,255,.9)}
.nb-row .meta{min-width:0;flex:1 1 auto}
.nb-row .meta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-row .meta em{font-family:var(--font-mono);font-style:normal;font-size:10px;color:var(--ink-3);letter-spacing:.02em}
.nb-row .pin{color:var(--ink-3);opacity:0;flex:0 0 auto}
.nb-row:hover .pin{opacity:1}
.side-ft{padding:8px 12px 12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:7px}
.quota{display:flex;flex-direction:column;gap:4px}
.quota .bar{height:4px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.quota .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s var(--ease)}
.empty-note{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.6}

/* ── stage ────────────────────────────────────────────────── */
.stage{
  grid-area:stage; position:relative; overflow:hidden; background:var(--desk);
  display:grid; place-items:center;
}
.stage::before{
  content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--panel) 60%,transparent),transparent 60%);
}
.paper-wrap{position:absolute;inset:0;display:grid;place-items:center;touch-action:none}
canvas.page{
  display:block; background:transparent; border-radius:2px;
  box-shadow:var(--shadow-3); touch-action:none; cursor:crosshair;
  transform-origin:0 0;
}
.stage.chrome-off .paper-wrap{inset:0}
.pg-ctl{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
  padding:4px;border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);box-shadow:var(--shadow-2);backdrop-filter:blur(12px);z-index:12;
}
.pg-ctl .num{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;padding:0 8px;color:var(--ink-2)}
.zoom-ctl{display:flex;align-items:center;gap:1px;padding-left:4px;margin-left:4px;border-left:1px solid var(--line-soft)}
.stage-hint{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:11;
  display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--panel);font-size:12px;
  box-shadow:var(--shadow-2);opacity:0;transition:opacity .3s var(--ease);pointer-events:none;
}
.stage-hint.show{opacity:1}
.stage-hint kbd{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.16)}
.desk-watermark{
  position:absolute;right:22px;bottom:18px;z-index:2;text-align:right;pointer-events:none;user-select:none;
  font-family:var(--font-display);font-size:34px;letter-spacing:.16em;color:var(--ink-4);opacity:.16;
}
body.tray-hidden .desk-watermark{bottom:24px}

/* ── tool rail ────────────────────────────────────────────── */
.rail{
  grid-area:rail; background:var(--panel); border-left:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 0 12px; overflow-y:auto;
}
.rail .grp{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.rail .sep{width:26px;height:1px;background:var(--line);margin:5px 0}
.tool{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent;transition:.13s var(--ease);position:relative;
}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--panel-3);color:var(--ink)}
.tool.on{background:var(--ink);color:var(--panel);box-shadow:var(--shadow-1)}
.tool .kbd-hint{position:absolute;bottom:-2px;right:-1px;font-family:var(--font-mono);font-size:9px;color:var(--ink-4);background:var(--panel);padding:0 2px;border-radius:3px}
.tool.on .kbd-hint{color:var(--panel-2);background:transparent;opacity:.6}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 10px}
.sw{width:20px;height:20px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);
  transition:.13s var(--ease);position:relative}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.rail-size{width:100%;padding:2px 16px 0}
.rail-size input[type=range]{width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--ink);border:2px solid var(--panel);margin-top:-6px;box-shadow:var(--shadow-1)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.rail-preview{width:34px;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden}
.rail-preview i{display:block;border-radius:50%;background:var(--ink)}

/* ── page tray ────────────────────────────────────────────── */
.tray{
  grid-area:tray; background:var(--panel-2); border-top:1px solid var(--line);
  display:flex; align-items:center; gap:9px; padding:0 12px; overflow-x:auto; overflow-y:hidden;
}
.tray-inner{display:flex;align-items:center;gap:9px;padding:11px 0}
.thumb{
  position:relative;width:56px;height:79px;flex:0 0 56px;border-radius:3px;overflow:hidden;
  border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow-1);
  transition:.14s var(--ease);
}
.thumb canvas{width:100%;height:100%;display:block}
.thumb:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 0 0 3px var(--accent),var(--shadow-2)}
.thumb .n{position:absolute;left:3px;bottom:3px;font-family:var(--font-mono);font-size:9px;
  padding:0 3px;border-radius:3px;background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--panel)}
.thumb-add{
  width:56px;height:79px;flex:0 0 56px;border-radius:3px;border:1.5px dashed var(--line);
  display:grid;place-items:center;color:var(--ink-3);
}
.thumb-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.thumb-add svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.tray .tray-tools{display:flex;align-items:center;gap:3px;margin-left:auto;padding-left:10px;
  border-left:1px solid var(--line);position:sticky;right:0;background:linear-gradient(90deg,transparent,var(--panel-2) 12px);padding-right:2px}

/* ── popovers / sheets ────────────────────────────────────── */
.pop{
  position:fixed;z-index:120;min-width:250px;max-width:min(420px,92vw);max-height:min(78dvh,720px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-3);
  padding:6px;animation:pop .15s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.985)}}
.pop .ph{padding:8px 10px 6px}
.pop .ph b{font-size:13px;font-weight:650}
.pop .ph p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.pop .pi{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-1);
  font-size:13px;text-align:left;color:var(--ink);
}
.pop .pi:hover{background:var(--panel-2)}
.pop .pi svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.7;flex:0 0 16px}
.pop .pi .sub{display:block;font-size:11px;color:var(--ink-3)}
.pop .pi .k{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-4)}
.pop hr{border:0;border-top:1px solid var(--line-soft);margin:5px 4px}
.sheet-scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 34%,transparent);z-index:110;animation:fade .18s var(--ease);backdrop-filter:blur(1.5px)}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:111;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--shadow-3);display:flex;flex-direction:column;
  animation:slide .22s var(--ease);
}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-hd h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:.01em}
.sheet-bd{flex:1 1 auto;overflow-y:auto;padding:6px 16px 26px}
.sheet-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.fld{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.fld:last-child{border-bottom:0}
.fld > label{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.fld .hint a{color:var(--accent)}
.inp{width:100%;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:13px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
textarea.inp{height:auto;min-height:70px;padding:9px 10px;resize:vertical;line-height:1.5}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button:hover{background:var(--panel-3)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.switch .lbl{font-size:13px}
.switch .lbl small{display:block;font-size:11.5px;color:var(--ink-3)}
.tog{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:0 0 42px;transition:.18s var(--ease)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow-1);transition:.18s var(--ease)}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1 1 auto}
.range-row .val{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);width:38px;text-align:right}
.status-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-2);background:var(--panel-2);border:1px solid var(--line-soft);font-size:12.5px}
.status-card svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.7;flex:0 0 17px}
.status-card.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.status-card.ok svg{stroke:var(--ok)}
.status-card.err{border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--panel))}
.status-card.err svg{stroke:var(--danger)}
.status-card .grow{flex:1 1 auto;min-width:0}
.status-card b{display:block;font-weight:600}
.status-card em{font-style:normal;color:var(--ink-3);font-size:11.5px;word-break:break-all}

/* ── modal ────────────────────────────────────────────────── */
.modal-scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);z-index:200;display:grid;place-items:center;padding:18px;animation:fade .16s var(--ease)}
.modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-4);
  box-shadow:var(--shadow-3);padding:20px;animation:pop .18s var(--ease)}
.modal h3{margin:0 0 6px;font-family:var(--font-display);font-size:18px;font-weight:600}
.modal p{margin:0 0 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal .preview{width:100%;aspect-ratio:1.414;border-radius:var(--r-2);border:1px solid var(--line);
  background:var(--panel-2);display:grid;place-items:center;margin-bottom:14px;overflow:hidden}

/* ── toast ────────────────────────────────────────────────── */
.toasts{position:fixed;left:50%;bottom:calc(var(--tray-h) + 18px);transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;
  background:var(--ink);color:var(--panel);font-size:12.5px;box-shadow:var(--shadow-2);
  animation:tin .22s var(--ease);max-width:min(560px,92vw);
}
.toast svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 15px}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.toast.out{animation:tout .22s var(--ease) forwards}
@keyframes tout{to{opacity:0;transform:translateY(6px) scale(.97)}}

/* ── misc ─────────────────────────────────────────────────── */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.busy-bar{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:400;width:0;transition:width .3s var(--ease);box-shadow:0 0 8px var(--accent)}
.drop-veil{position:fixed;inset:0;z-index:250;background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:2px dashed var(--accent);display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--accent);backdrop-filter:blur(3px)}
.mobile-only{display:none}
.backdrop-mobile{position:fixed;inset:0;background:color-mix(in srgb,#000 35%,transparent);z-index:55;animation:fade .18s var(--ease)}

@media (max-width:900px){
  :root{--hdr-h:50px;--tray-h:96px}
  .app{grid-template-columns:0 1fr 0;grid-template-areas:"hdr hdr hdr" "stage stage stage" "tray tray tray"}
  .side{position:fixed;top:var(--hdr-h);bottom:0;left:0;width:min(300px,84vw);z-index:60;transform:translateX(-102%);
    transition:transform .22s var(--ease);box-shadow:var(--shadow-3)}
  body.side-open .side{transform:none}
  .rail{position:fixed;left:0;right:0;bottom:var(--tray-h);flex-direction:row;justify-content:center;
    border-left:0;border-top:1px solid var(--line);padding:7px 8px;gap:4px;overflow-x:auto;z-index:30}
  .rail .grp{flex-direction:row;width:auto;gap:4px}
  .rail .sep{width:1px;height:24px;margin:0 4px}
  .swatches{grid-template-columns:repeat(4,1fr);padding:0;width:auto}
  .rail-size{width:120px;padding:0 6px}
  .tool{width:38px;height:38px}
  .mobile-only{display:grid}
  .desk-watermark{display:none}
  .pg-ctl{bottom:8px}
}
@media (max-width:560px){
  .brand .word{display:none}
  .nb-switch{max-width:170px}
  .hdr-sep{display:none}
}
</style>
</head>

<script>
/* HandNote — 손글씨 노트 ----------------------------------------------------
   배포 시 아래 설정을 채우면 사용자가 앱에서 입력할 필요가 없습니다.
   googleClientId: Google Cloud Console > 사용자 인증 정보 > OAuth 클라이언트 ID(웹)
   승인된 JavaScript 출처에 이 앱의 주소를 등록해야 합니다.
--------------------------------------------------------------------------- */
window.HANDNOTE_CONFIG = {
  googleClientId: "",          // 예: "1234567890-abc.apps.googleusercontent.com"

<script>
/* ═══════════════════════════════════════════════════════════════
   HandNote — part 1 : 상수 · 유틸 · 저장소 · 종이/획 렌더링 · 히스토리
   ═══════════════════════════════════════════════════════════════ */
(function () {
'use strict';

var CFG = Object.assign({ googleClientId: '', driveFolderName: 'HandNote' }, window.HANDNOTE_CONFIG || {});

var PAGE_W = 1240, PAGE_H = 1754;   // A4 150dpi 기준 좌표계 (세로)
var RULE = 31;                      // 괘선 간격

var PT = 3;                         // 점 1개당 값 수: x, y, pressure

var COVERS = ['#1F5FD0','#C0392B','#2E7D5B','#B7791F','#6B4FBB','#0E7490','#9A3412','#334155','#9D174D','#4D7C0F'];
var INKS   = ['#1B1A17','#1F5FD0','#C0392B','#2E7D5B','#B7791F','#6B4FBB','#0E7490','#E9E5DC'];
var PAPERS = { dot: '도트', grid: '모눈', ruled: '줄', blank: '무지' };
var TONES  = { white: '#ffffff', warm: '#fbf7ee', dark: '#262320' };

/* ── 유틸 ───────────────────────────────────────────────────── */
var $  = function (s, r) { return (r || document).querySelector(s); };

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function uid(p) { return (p || 'id') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function fmtDate(ts) {
  var d = new Date(ts), n = new Date();
  var p2 = function (v) { return String(v).padStart(2, '0'); };
  if (d.toDateString() === n.toDateString()) return p2(d.getHours()) + ':' + p2(d.getMinutes());
  var y = d.getFullYear() !== n.getFullYear() ? d.getFullYear() + '. ' : '';
  return y + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
}
function fmtBytes(b) {

  var u = ['KB', 'MB', 'GB', 'TB'], i = -1;

  return (b < 10 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
}

    var a = arguments, self = this;

}

    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function toast(msg, kind, ms) {

  var ico = kind === 'err' ? 'i-warn' : kind === 'ok' ? 'i-check' : 'i-info';
  var t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = '<svg><use href="#' + ico + '"/></svg><span>' + esc(msg) + '</span>';
  host.appendChild(t);
  setTimeout(function () {
    t.classList.add('out');
    setTimeout(function () { t.remove(); }, 240);
  }, ms || 2200);
}
function busy(on) {
  var b = $('#busy');
  if (!b) return;
  if (on) { b.style.width = '34%'; setTimeout(function () { b.style.width = '72%'; }, 400); }
  else { b.style.width = '100%'; setTimeout(function () { b.style.width = '0'; }, 320); }
}
function download(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function pickFile(accept) {
  return new Promise(function (res) {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = accept || '';
    i.style.position = 'fixed'; i.style.left = '-9999px';
    document.body.appendChild(i);
    i.addEventListener('change', function () { res(i.files && i.files[0] || null); i.remove(); });
    i.click();
  });
}

/* ── 저장소: IndexedDB, 실패 시 메모리 폴백 ─────────────────── */
var DB = (function () {
  var NAME = 'handnote', VER = 1, _db = null, mem = null;
  // file:// 로 직접 열면 브라우저가 IndexedDB 호출을 멈춰 세우는 경우가 있어 바로 메모리 모드로 갑니다.
  var _broken = (location.protocol === 'file:');

  function memdb() {
    if (!mem) {
      mem = { notebooks: new Map(), pages: new Map(), meta: new Map() };
      console.warn('[HandNote] IndexedDB 를 쓸 수 없어 메모리 모드로 동작합니다.');
    }
    return mem;
  }
  function open() {
    if (_db) return Promise.resolve(_db);
    if (_broken) return Promise.reject(new Error('idb-unavailable'));
    return new Promise(function (res, rej) {
      var rq;
      try { rq = indexedDB.open(NAME, VER); }
      catch (e) { _broken = true; rej(e); return; }
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('notebooks')) db.createObjectStore('notebooks', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('pages')) {
          var s = db.createObjectStore('pages', { keyPath: 'id' });
          s.createIndex('notebookId', 'notebookId');
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      rq.onsuccess = function () { _db = rq.result; res(_db); };
      rq.onerror = function () { _broken = true; rej(rq.error || new Error('idb-open-failed')); };
      rq.onblocked = function () { };
    });
  }
  function req(r) {
    return new Promise(function (res, rej) {
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function run(store, mode, fn) {
    return open().then(function (db) {
      return req(fn(db.transaction(store, mode).objectStore(store)));
    });
  }

  return {
    isMemory: function () { return _broken; },
    all: function (store) {
      return run(store, 'readonly', function (s) { return s.getAll(); })
        .catch(function () { return Array.from(memdb()[store].values()); });
    },
    get: function (store, id) {
      return run(store, 'readonly', function (s) { return s.get(id); })
        .catch(function () { return memdb()[store].get(id); });
    },
    put: function (store, val) {
      return run(store, 'readwrite', function (s) { return s.put(val); })
        .catch(function () { memdb()[store].set(val.id || val.k, val); return val; });
    },
    putMany: function (store, vals) {
      if (!vals.length) return Promise.resolve();
      return open().then(function (db) {
        var t = db.transaction(store, 'readwrite'), s = t.objectStore(store);
        vals.forEach(function (v) { s.put(v); });
        return new Promise(function (res, rej) { t.oncomplete = res; t.onerror = function () { rej(t.error); }; });
      }).catch(function () { vals.forEach(function (v) { memdb()[store].set(v.id || v.k, v); }); });
    },
    del: function (store, id) {
      return run(store, 'readwrite', function (s) { return s.delete(id); })
        .catch(function () { memdb()[store].delete(id); });
    },
    delMany: function (store, ids) {
      if (!ids.length) return Promise.resolve();
      return open().then(function (db) {
        var t = db.transaction(store, 'readwrite'), s = t.objectStore(store);
        ids.forEach(function (id) { s.delete(id); });
        return new Promise(function (res, rej) { t.oncomplete = res; t.onerror = function () { rej(t.error); }; });
      }).catch(function () { ids.forEach(function (id) { memdb()[store].delete(id); }); });
    },
    pagesOf: function (nbId) {
      return run('pages', 'readonly', function (s) { return s.index('notebookId').getAll(nbId); })
        .catch(function () {
          return Array.from(memdb().pages.values()).filter(function (p) { return p.notebookId === nbId; });
        });
    },
    estimate: function () {
      if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
      return navigator.storage.estimate().catch(function () { return null; });
    },
    wipe: function () {
      return open().then(function (db) { db.close(); _db = null; return req(indexedDB.deleteDatabase(NAME)); })
        .catch(function () { });
    }
  };
})();

/* ── 종이(괘선) 렌더링 ─────────────────────────────────────── */
function drawPaper(ctx, w, h, type, tone) {
  var bg = TONES[tone] || TONES.white;
  var dark = tone === 'dark';
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  if (type !== 'blank') {
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.115)' : 'rgba(44,68,112,.24)';
    ctx.fillStyle = dark ? 'rgba(255,255,255,.20)' : 'rgba(44,68,112,.36)';
    ctx.lineWidth = 1;
    var x, y;
    if (type === 'grid') {
      ctx.beginPath();
      for (x = RULE; x < w; x += RULE) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, h); }
      for (y = RULE; y < h; y += RULE) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(w, Math.round(y) + .5); }
      ctx.stroke();
    } else if (type === 'dot') {
      for (x = RULE; x < w; x += RULE) {
        for (y = RULE; y < h; y += RULE) {
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, 6.2832);
          ctx.fill();
        }
      }
    } else if (type === 'ruled') {
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.14)' : 'rgba(44,68,112,.26)';
      ctx.beginPath();
      for (y = RULE * 2; y < h; y += RULE * 2) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(w, Math.round(y) + .5); }
      ctx.stroke();
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(44,68,112,.38)';
      ctx.beginPath();
      ctx.moveTo(0, 0.5); ctx.lineTo(w, 0.5);
      ctx.stroke();
    }
    // 공책 세로 여백선
    ctx.strokeStyle = dark ? 'rgba(201,99,79,.7)' : 'rgba(210,80,60,.66)';
    ctx.lineWidth = 1.9;
    ctx.beginPath();
    ctx.moveTo(MARGIN_X + .5, 0); ctx.lineTo(MARGIN_X + .5, h);
    ctx.stroke();
  }
  ctx.restore();
}

/* ── 획(스트로크) ──────────────────────────────────────────── */
function widthFactor(p, gamma) {
  p = clamp(p, 0.02, 1);
  return 0.22 + 0.78 * Math.pow(p, gamma);
}
function pressureGamma() { return 0.45 + (1 - S.prefs.pressure) * 1.35; }

function drawStroke(ctx, s, opts) {

  var g = pressureGamma();
  ctx.save();
  ctx.globalCompositeOperation = s.t === 'high' ? 'multiply' : 'source-over';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = s.c;

  if (n === 1) {
    var r = Math.max(0.6, (s.w * (s.t === 'high' ? 1 : widthFactor(pp[2], g))) / 2);
    ctx.beginPath();
    ctx.arc(pp[0], pp[1], r, 0, 6.2832);
    ctx.fill();
    ctx.restore();
    return;
  }
  var i, x0, y0, p0, x1, y1, p1, w0, w1, dx, dy, len, nx, ny;
  for (i = 0; i < n - 1; i++) {
    x0 = pp[i * PT]; y0 = pp[i * PT + 1]; p0 = pp[i * PT + 2];
    x1 = pp[(i + 1) * PT]; y1 = pp[(i + 1) * PT + 1]; p1 = pp[(i + 1) * PT + 2];
    w0 = s.t === 'high' ? s.w : s.w * widthFactor(p0, g);
    w1 = s.t === 'high' ? s.w : s.w * widthFactor(p1, g);
    if (w0 < 0.4) w0 = 0.4;
    if (w1 < 0.4) w1 = 0.4;
    dx = x1 - x0; dy = y1 - y0;
    len = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    nx = -dy / len; ny = dx / len;
    ctx.beginPath();
    ctx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2);
    ctx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2);
    ctx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
    ctx.closePath();
    ctx.fill();
    if (s.t !== 'high' && i % 1 === 0) {
      ctx.beginPath();
      ctx.arc(x0, y0, w0 / 2, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawStrokes(ctx, list, opts) {
  for (var i = 0; i < list.length; i++) drawStroke(ctx, list[i], opts);
}

/* 연속 점 단순화 (RDP-lite) */
function simplify(pts, tol) {
  if (pts.length < 3 * PT) return pts;
  var out = [pts[0], pts[1], pts[2]], i, lx = pts[0], ly = pts[1], px, py, d;
  for (i = 1; i < pts.length / PT - 1; i++) {
    px = pts[i * PT]; py = pts[i * PT + 1];
    d = Math.abs(px - lx) + Math.abs(py - ly);
    if (d >= tol) { out.push(px, py, pts[i * PT + 2]); lx = px; ly = py; }
  }
  out.push(pts[pts.length - 3], pts[pts.length - 2], pts[pts.length - 1]);
  return out;
}

/* 이동평균 스무딩(입력 중 1회) */
function smoothPts(pts, amt) {
  if (amt <= 0 || pts.length < 3 * PT * 3) return pts;
  var k = amt * 0.5, out = pts.slice(), n = pts.length / PT, i;
  for (i = 1; i < n - 1; i++) {
    out[i * PT]     = pts[i * PT]     * (1 - k) + (pts[(i - 1) * PT] + pts[(i + 1) * PT]) * k / 2;
    out[i * PT + 1] = pts[i * PT + 1] * (1 - k) + (pts[(i - 1) * PT + 1] + pts[(i + 1) * PT + 1]) * k / 2;
  }
  // 압력도 살짝 평활
  for (i = 1; i < n - 1; i++) {
    out[i * PT + 2] = clamp(pts[i * PT + 2] * (1 - k * 0.6) + (pts[(i - 1) * PT + 2] + pts[(i + 1) * PT + 2]) * k * 0.3, 0.02, 1);
  }
  return out;
}

  for (i = 0; i < pp.length; i += PT) {
    if (pp[i] < x0) x0 = pp[i];
    if (pp[i] > x1) x1 = pp[i];
    if (pp[i + 1] < y0) y0 = pp[i + 1];
    if (pp[i + 1] > y1) y1 = pp[i + 1];
  }
  return { x0: x0, y0: y0, x1: x1, y1: y1 };
}

  var b = null, i, s;
  for (i = 0; i < list.length; i++) {
    s = strokeBounds(list[i]);
    if (!b) b = s;
    else { b.x0 = Math.min(b.x0, s.x0); b.y0 = Math.min(b.y0, s.y0); b.x1 = Math.max(b.x1, s.x1); b.y1 = Math.max(b.y1, s.y1); }
  }
  return b;
}

  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

  var r = tol + s.w * 0.5;
  if (n === 1) return Math.hypot(x - pp[0], y - pp[1]) <= r;
  for (i = 0; i < n - 1; i++) {
    d = segDist(x, y, pp[i * PT], pp[i * PT + 1], pp[(i + 1) * PT], pp[(i + 1) * PT + 1]);

  }

}

  for (i = 0, j = poly.length / 2 - 1; i < poly.length / 2; j = i++) {

/* ── 히스토리(실행 취소/다시 실행) ─────────────────────────── */
function pushHistory(cmd) {
  S.history = S.history.slice(0, S.hIdx + 1);
  S.history.push(cmd);
  if (S.history.length > MAX_UNDO) S.history.shift();
  S.hIdx = S.history.length - 1;
  refreshHistoryUI();
}
function applyCmd(cmd, forward) {
  var p = pageOf(cmd.pageId);
  if (!p) return;
  if (cmd.t === 'add') {
    if (forward) p.strokes.push(cmd.stroke);
    else {
      var i = p.strokes.indexOf(cmd.stroke);
      if (i >= 0) p.strokes.splice(i, 1);
    }
  } else if (cmd.t === 'del') {
    if (forward) {
      cmd.strokes.forEach(function (s) {
        var k = p.strokes.indexOf(s);
        if (k >= 0) p.strokes.splice(k, 1);
      });
    } else {
      p.strokes = cmd.strokes.concat(p.strokes);
    }
  } else if (cmd.t === 'clear') {
    if (forward) p.strokes = [];
    else p.strokes = cmd.strokes.slice();
  } else if (cmd.t === 'move') {
    var dx = forward ? cmd.dx : -cmd.dx, dy = forward ? cmd.dy : -cmd.dy;
    p.strokes.forEach(function (s) {
      if (cmd.ids.indexOf(s.id) < 0) return;
      for (var i = 0; i < s.p.length; i += PT) { s.p[i] += dx; s.p[i + 1] += dy; }
    });
  } else if (cmd.t === 'pts') {
    p.strokes.forEach(function (s) {
      var k = cmd.ids.indexOf(s.id);
      if (k < 0) return;
      s.p = (forward ? cmd.after[k] : cmd.before[k]).slice();
    });
  } else if (cmd.t === 'order') {
    p.strokes = forward ? cmd.after.slice() : cmd.before.slice();
  }
  markDirty(p);
}
function undo() {
  if (S.hIdx < 0) { toast('되돌릴 작업이 없습니다'); return; }
  var cmd = S.history[S.hIdx];
  S.hIdx--;
  applyCmd(cmd, false);
  var i = idxOfPage(cmd.pageId);
  if (i >= 0 && i !== S.pageIdx) { S.pageIdx = i; }
  afterHistory(cmd.pageId);
  refreshHistoryUI();
}
function redo() {
  if (S.hIdx >= S.history.length - 1) { toast('다시 실행할 작업이 없습니다'); return; }
  var cmd = S.history[S.hIdx + 1];
  S.hIdx++;
  applyCmd(cmd, true);
  var i = idxOfPage(cmd.pageId);
  if (i >= 0 && i !== S.pageIdx) { S.pageIdx = i; }
  afterHistory(cmd.pageId);
  refreshHistoryUI();
}
function afterHistory(pageId) {
  var p = pageOf(pageId);
  if (p) markDirty(p);
  window._HN.rebuildCommit();
  window._HN.render();
  window._HN.syncPageUI();
  queuePageSave(p);
}
function refreshHistoryUI() {
  var u = $('#btnUndo'), r = $('#btnRedo');
  if (u) u.disabled = S.hIdx < 0;
  if (r) r.disabled = S.hIdx >= S.history.length - 1;
}

/* ── 노트북/쪽 관리 ───────────────────────────────────────── */
function newPage(nbId, first) {
  return {
    id: uid('pg'), notebookId: nbId, strokes: [], updatedAt: Date.now(),
    background: first || null, createdAt: Date.now(), driveFileId: null, dirty: false
  };
}
function newNotebook(title) {
  var used = S.notebooks.map(function (n) { return n.cover; });
  var cover = COVERS.filter(function (c) { return used.indexOf(c) < 0; })[0] || COVERS[Math.floor(Math.random() * COVERS.length)];
  return {
    id: uid('nb'), title: title || '새 공책', cover: cover, createdAt: Date.now(), updatedAt: Date.now(),
    pageOrder: [], background: 'dot', tone: 'white', driveFileId: null, driveMod: 0
  };
}

/* ── 저장 ──────────────────────────────────────────────────── */
var pageSaveTimers = {};
function queuePageSave(page) {
  if (!page) return;
  setDirtyLabel(true);
  clearTimeout(pageSaveTimers[page.id]);
  pageSaveTimers[page.id] = setTimeout(function () {
    page.dirty = true;
    DB.put('pages', page).then(function () {
      setDirtyLabel(false);
    });

  // 해당 쪽 썸네일만 다시 그린다

/*PDF-BUILD-START*/
function buildPdf(imgs) {
  // imgs: [{ bytes: Uint8Array(jpeg), w:Number, h:Number }]
  var ptW = 595.28, ptH = 841.89;
  var parts = [], len = 0, offsets = [];
  function push(u8) { parts.push(u8); len += u8.length; }
  function str(s) { push(new TextEncoder().encode(s)); }
  function obj(n, write) { offsets[n] = len; str(n + ' 0 obj\n'); write(); str('\nendobj\n'); }

  str('%PDF-1.4\n');
  push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

  var n = imgs.length;
  var N = 2 + n * 3;
  var kids = [];
  for (var i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');

  obj(1, function () { str('<< /Type /Catalog /Pages 2 0 R >>'); });
  obj(2, function () { str('<< /Type /Pages /Count ' + n + ' /Kids [' + kids.join(' ') + '] >>'); });

  for (var j = 0; j < n; j++) {
    (function (i) {
      var pg = 3 + i * 3, ct = 4 + i * 3, im = 5 + i * 3;
      var img = imgs[i];
      obj(pg, function () {
        str('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + ptW.toFixed(2) + ' ' + ptH.toFixed(2) + '] ' +
          '/Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
      });
      obj(ct, function () {
        var c = 'q ' + ptW.toFixed(2) + ' 0 0 ' + ptH.toFixed(2) + ' 0 0 cm /Im0 Do Q';
        str('<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream');
      });
      obj(im, function () {
        str('<< /Type /XObject /Subtype /Image /Width ' + img.w + ' /Height ' + img.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.bytes.length + ' >>\nstream\n');
        push(img.bytes);
        str('\nendstream');
      });
    })(j);
  }

  var xref = len;
  str('xref\n0 ' + (N + 1) + '\n0000000000 65535 f \n');
  for (var k = 1; k <= N; k++) str(String(offsets[k]).padStart(10, '0') + ' 00000 n \n');
  str('trailer\n<< /Size ' + (N + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

  var out = new Uint8Array(len), o = 0;
  for (var p2 = 0; p2 < parts.length; p2++) { out.set(parts[p2], o); o += parts[p2].length; }
  return out;
}
/*PDF-BUILD-END*/

function exportPdf() {
  if (!S.pages.length) return;
  H.busy(true);
  var imgs = [], i = 0;
  function step() {
    if (i >= S.pages.length) {
      var bytes = buildPdf(imgs);
      H.busy(false);
      H.download(new Blob([bytes], { type: 'application/pdf' }), safeName(S.nb.title) + '.pdf');
      H.toast(S.pages.length + '쪽 PDF 를 만들었습니다', 'ok', 3000);
      return;
    }
    var p = S.pages[i], idx = i; i++;
    var c = H.canvas.pageBitmap(p, 1.5);
    c.toBlob(function (b) {
      b.arrayBuffer().then(function (ab) {
        imgs[idx] = { bytes: new Uint8Array(ab), w: c.width, h: c.height };
        setTimeout(step, 10);
      });
    }, 'image/jpeg', 0.88);
  }
  step();
}

  };
}
function exportNotebookJson(nb) {

function importJson() {

    f.text().then(function (txt) {
      var data = JSON.parse(txt);

        fresh.cover = nb.cover || fresh.cover;
        fresh.background = nb.background || 'dot';

        });
        if (!pages.length) pages.push(H.newPage(fresh.id));
        fresh.pageOrder = pages.map(function (p) { return p.id; });

          S.notebooks.unshift(fresh);
        }));
      });
      Promise.all(jobs).then(function () {

/* ── 구글 드라이브 ─────────────────────────────────────────── */
var Drive = (function () {
  var GSI = 'https://accounts.google.com/gsi/client';
  var SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
  var loading = null;

  function hasId() { return !!(S.prefs.driveClientId || '').trim(); }
  function loadSdk() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (loading) return loading;
    loading = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = GSI; s.async = true; s.defer = true;
      s.onload = function () { res(); };
      s.onerror = function () { loading = null; rej(new Error('Google 로그인 스크립트를 불러오지 못했습니다 (오프라인이거나 차단됨)')); };
      document.head.appendChild(s);
    });
    return loading;
  }
  function token(interactive) {
    if (S.drive.token && Date.now() < S.drive.exp - 60000) return Promise.resolve(S.drive.token);
    if (!hasId()) return Promise.reject(new Error('Google 클라이언트 ID 가 필요합니다'));
    return loadSdk().then(function () {
      return new Promise(function (res, rej) {
        var tc = google.accounts.oauth2.initTokenClient({
          client_id: S.prefs.driveClientId.trim(), scope: SCOPE,
          callback: function (r) {
            if (r && r.access_token) {
              S.drive.token = r.access_token;
              S.drive.exp = Date.now() + (r.expires_in ? r.expires_in * 1000 : 3300000);
              res(r.access_token);
            } else rej(new Error((r && r.error) || '인증이 취소되었습니다'));
          },
          error_callback: function (err) { rej(new Error((err && err.message) || '인증 창을 열 수 없습니다 (팝업 차단을 확인하세요)')); }
        });
        try { tc.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
        catch (e) { rej(e); }
      });
    });
  }
  function api(url, opts) {
    opts = opts || {};
    var headers = Object.assign({ Authorization: 'Bearer ' + S.drive.token }, opts.headers || {});
    return fetch(url, Object.assign({}, opts, { headers: headers })).then(function (r) {
      if (r.status === 401) { S.drive.token = null; throw new Error('인증이 만료되었습니다. 다시 연결해 주세요.'); }
      if (!r.ok) {
        return r.text().then(function (t) {
          var m = 'Drive 오류 ' + r.status;
          try { var j = JSON.parse(t); if (j.error && j.error.message) m += ': ' + j.error.message; } catch (e) { }
          throw new Error(m);
        });
      }
      if (r.status === 204) return null;
      return r.json();
    });
  }
  function ensureFolder() {
    if (S.drive.folderId) return Promise.resolve(S.drive.folderId);
    var name = (S.prefs.driveFolder || 'HandNote').trim();
    var q = "mimeType='application/vnd.google-apps.folder' and name='" + name.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "' and trashed=false";
    return api('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q=' + encodeURIComponent(q))
      .then(function (r) {
        if (r.files && r.files.length) return r.files[0].id;
        return api('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, mimeType: 'application/vnd.google-apps.folder' })
        }).then(function (f) { return f.id; });
      })
      .then(function (id) { S.drive.folderId = id; return id; });
  }
  function listFiles(folderId) {
    var q = "'" + folderId + "' in parents and trashed=false";
    return api('https://www.googleapis.com/drive/v3/files?spaces=drive&pageSize=1000&orderBy=modifiedTime desc' +
      '&fields=files(id,name,modifiedTime,appProperties)&q=' + encodeURIComponent(q))
      .then(function (r) { return r.files || []; });
  }
  function saveFile(fileId, nb, payload, folderId) {
    var meta = {
      name: safeName(nb.title) + ' (' + nb.id.slice(-6) + ').json',
      mimeType: 'application/json',
      appProperties: { handnote: '1', nbId: nb.id }
    };
    if (!fileId) meta.parents = [folderId];
    var b = 'hnb' + Math.random().toString(36).slice(2);
    var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
      '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(payload) +
      '\r\n--' + b + '--';
    var url = 'https://www.googleapis.com/upload/drive/v3/files' + (fileId ? '/' + fileId : '') +
      '?uploadType=multipart&fields=id,modifiedTime';
    return api(url, { method: fileId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: body });
  }
  function getMedia(fileId) {
    return api('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
  }
  function pushOne(nb, remote, folderId) {
    return H.DB.pagesOf(nb.id).then(function (pages) {
      return saveFile(remote ? remote.id : null, nb, notebookPayload(nb, pages), folderId);
    }).then(function (f) {
      if (f && f.id) {
        nb.driveFileId = f.id;
        if (f.modifiedTime) nb.driveMod = Date.parse(f.modifiedTime);
      }
      nb.updatedAt = Date.now();
      return H.DB.put('notebooks', nb);
    });
  }
  function pullOne(remote) {
    var nbId = (remote.appProperties || {}).nbId;
    return getMedia(remote.id).then(function (data) {
      if (!data || !data.pages) throw new Error('백업 파일 형식이 아닙니다');
      var nb = data.notebook || {};
      var fresh = {
        id: nbId, title: nb.title || '드라이브 공책', cover: nb.cover || H.COVERS[0],
        background: nb.background || 'dot', tone: nb.tone || 'white',
        createdAt: nb.createdAt || Date.now(), updatedAt: Date.now(),
        driveFileId: remote.id, driveMod: Date.parse(remote.modifiedTime || '') || 0
      };
      var pages = data.pages.map(function (p) {
        return { id: H.uid('pg'), notebookId: nbId, background: p.background, strokes: p.strokes || [], updatedAt: Date.now(), createdAt: Date.now() };
      });
      if (!pages.length) pages.push(H.newPage(nbId));
      fresh.pageOrder = pages.map(function (p) { return p.id; });
      fresh.pageCount = pages.length;
      return H.DB.pagesOf(nbId).then(function (old) {
        return H.DB.delMany('pages', old.map(function (p) { return p.id; }));
      }).then(function () {
        return H.DB.put('notebooks', fresh);
      }).then(function () {
        return H.DB.putMany('pages', pages);
      });
    });
  }
  function setBadge(state, msg) {
    var b = $('#syncBadge');
    if (!b) return;
    b.style.display = state ? '' : 'none';
    b.className = 'badge' + (state === 'err' ? ' err' : state === 'busy' ? ' warn' : '');
    if (msg) $('#btnSync').title = msg;
  }
  function sync(dir, silent) {
    if (S.drive.syncing) return Promise.resolve(null);
    if (!hasId()) { if (!silent) { openSettings(); H.toast('설정에서 Google 클라이언트 ID 를 먼저 입력하세요', 'err'); } return Promise.resolve(null); }
    setBadge('busy', '동기화 중…');
    S.drive.syncing = true;
    return token(!silent).then(function () { return ensureFolder(); }).then(function (fid) {
      return listFiles(fid).then(function (files) {
        var byNb = {};
        files.forEach(function (f) { var p = f.appProperties || {}; if (p.nbId) byNb[p.nbId] = f; });
        var up = 0, dn = 0, jobs = [];
        return H.DB.all('notebooks').then(function (locals) {
          locals.forEach(function (nb) {
            var rem = byNb[nb.id];
            var lTs = nb.updatedAt || 0;
            var rTs = rem ? (Date.parse(rem.modifiedTime) || 0) : 0;
            if (dir === 'down') { if (rem) jobs.push(pullOne(rem).then(function () { dn++; })); return; }
            if (dir === 'up' || !rem || lTs > rTs + 2000) { jobs.push(pushOne(nb, rem, fid).then(function () { up++; })); return; }
            if (rTs > lTs + 2000) jobs.push(pullOne(rem).then(function () { dn++; }));
          });
          if (dir !== 'up') {
            files.forEach(function (f) {
              var p = f.appProperties || {};
              if (!p.nbId) return;
              if (!locals.some(function (n) { return n.id === p.nbId; })) jobs.push(pullOne(f).then(function () { dn++; }));
            });
          }
          return Promise.all(jobs).then(function () { return { up: up, dn: dn }; });
        });
      });
    }).then(function (r) {
      S.drive.syncing = false;
      S.drive.lastSync = Date.now();
      S.drive.error = null;
      setBadge(S.prefs.autoSync ? 'ok' : null, '마지막 동기화 ' + H.fmtDate(Date.now()));
      renderSettingsIfOpen();
      if (!silent) H.toast('동기화 완료 · 올림 ' + r.up + ' · 내림 ' + r.dn, 'ok', 3000);
      return H.DB.all('notebooks').then(function (list) {
        S.notebooks = list.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
        renderNbList();
        if (r.dn > 0) return openNotebook(S.prefs.lastNb || S.notebooks[0].id);
      });
    }).catch(function (e) {
      S.drive.syncing = false;
      S.drive.error = e.message;
      setBadge('err', e.message);
      renderSettingsIfOpen();
      if (!silent) H.toast(e.message, 'err', 4200);
    });
  }
  return { sync: sync, connect: function () { return token(true).then(function () { H.toast('구글 드라이브에 연결되었습니다', 'ok'); }).catch(function (e) { H.toast(e.message, 'err'); throw e; }); }, setBadge: setBadge, hasId: hasId, getToken: function () { return S.drive.token; } };
})();
window._HN.Drive = Drive;
H.driveAutoCheck = function () { };

/* ── 설정 시트 ─────────────────────────────────────────────── */
function rangeRow(id, min, max, step, val, fmt) {
  return '<div class="range-row"><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"><span class="val" id="' + id + 'V">' + fmt(val) + '</span></div>';
}
var sheetEl = null;
function openSettings() {
  closeSheet();
  var p = S.prefs;
  var html =
    '<div class="sheet-hd"><h2>설정</h2><span style="flex:1"></span>' +
    '<button class="ibtn" id="sheetX" title="닫기"><svg><use href="#i-close"/></svg></button></div>' +
    '<div class="sheet-bd">' +

    '<div class="fld"><label>펜</label>' +
    '<div class="switch"><span class="lbl">필압 반영<small>펜을 세게 누르면 굵게 · 살짝 누르면 가늘게</small></span><button class="tog" id="tPressure" role="switch"></button></div>' +
    '<div style="margin-top:8px"><span class="ebrow">필압 민감도</span>' + rangeRow('setPressure', 0, 1, 0.05, p.pressure, function (v) { return Math.round(v * 100) + '%'; }) + '</div>' +
    '<div style="margin-top:10px"><span class="ebrow">손떨림 보정</span>' + rangeRow('setSmooth', 0, 1, 0.05, p.smoothing, function (v) { return Math.round(v * 100) + '%'; }) + '</div>' +

    '승인된 JavaScript 출처에 이 앱 주소를 추가하세요. Google Drive API 도 사용 설정해야 합니다. ' +
    '노트는 <b>내 드라이브</b>의 <b>' + esc(p.driveFolder || 'HandNote') + '</b> 폴더에만 저장되며, 앱은 자기가 만든 파일만 읽습니다.</div>' +
    '<div class="switch" style="margin-top:10px"><span class="lbl">자동 동기화<small>공책을 열 때 조용히 맞춥니다</small></span><button class="tog" id="tAuto" role="switch"></button></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
    '<button class="btn" id="dConnect"><svg><use href="#i-cloud"/></svg>연결</button>' +
    '<button class="btn primary" id="dSync"><svg><use href="#i-sync"/></svg>지금 동기화</button>' +
    '<button class="btn" id="dUp"><svg><use href="#i-upload"/></svg>올리기</button>' +
    '<button class="btn" id="dDown"><svg><use href="#i-download"/></svg>가져오기</button>' +
    '</div></div>' +

    '<div class="fld"><label>저장소</label>' +
    '<div class="status-card" id="storeStatus"><svg><use href="#i-info"/></svg><span class="grow"><b id="storeTitle">—</b><em id="storeSub">—</em></span></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
    '<button class="btn" id="sBackup"><svg><use href="#i-download"/></svg>전체 백업</button>' +
    '<button class="btn" id="sRestore"><svg><use href="#i-upload"/></svg>백업 복원</button>' +
    '<button class="btn danger" id="sWipe"><svg><use href="#i-trash"/></svg>모두 삭제</button>' +
    '</div>' +
    '<div class="hint">모든 필기는 이 브라우저(IndexedDB)에 먼저 저장됩니다. 브라우저 데이터를 지우면 사라지므로 중요한 공책은 정기적으로 백업하세요.</div>' +
    '</div>' +

    '<div class="fld"><label>정보</label>' +
    '<div class="hint">HandNote · 단일 HTML 필기 노트 · 오프라인 동작 · <span id="verLine">v1.0</span></div>' +
    '</div>' +
    '</div>' +
    '<div class="sheet-ft"><button class="btn primary wide" id="sheetDone">닫기</button></div>';

  var scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = html;
  $('#layer').appendChild(scrim); $('#layer').appendChild(sheet);
  sheetEl = { scrim: scrim, sheet: sheet };

  scrim.onclick = closeSheet;
  $('#sheetX', sheet).onclick = closeSheet;
  $('#sheetDone', sheet).onclick = closeSheet;

  function tog(id, key, onChange) {
    var b = $('#' + id, sheet);
    b.setAttribute('aria-checked', S.prefs[key] ? 'true' : 'false');
    b.onclick = function () {
      S.prefs[key] = !S.prefs[key];
      b.setAttribute('aria-checked', S.prefs[key] ? 'true' : 'false');
      H.savePrefs();
      if (onChange) onChange();
    };
  }
  tog('tPressure', 'pressure'); tog('tPalm', 'palmReject');
  tog('tTouch', 'touchDraw'); tog('tAuto', 'autoSync', function () { Drive.setBadge(S.prefs.autoSync && S.drive.token ? 'ok' : null); });

  var pr = $('#setPressure', sheet), sm = $('#setSmooth', sheet);
  pr.oninput = function () { S.prefs.pressure = +pr.value; $('#setPressureV', sheet).textContent = Math.round(pr.value * 100) + '%'; H.savePrefs(); };
  sm.oninput = function () { S.prefs.smoothing = +sm.value; $('#setSmoothV', sheet).textContent = Math.round(sm.value * 100) + '%'; H.savePrefs(); };

  sheet.querySelectorAll('#themeSeg button').forEach(function (b) {
    b.onclick = function () { applyTheme(b.dataset.v); sheet.querySelectorAll('#themeSeg button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
  });

  var dc = $('#driveClient', sheet), df = $('#driveFolder', sheet);
  dc.onchange = function () { S.prefs.driveClientId = dc.value.trim(); H.savePrefs(); S.drive.token = null; S.drive.folderId = null; renderSettingsIfOpen(); };
  df.onchange = function () { S.prefs.driveFolder = df.value.trim() || 'HandNote'; H.savePrefs(); S.drive.folderId = null; };

  $('#dConnect', sheet).onclick = function () { Drive.connect().catch(function () { }); };
  $('#dSync', sheet).onclick = function () { Drive.sync('both'); };
  $('#dUp', sheet).onclick = function () { Drive.sync('up'); };
  $('#dDown', sheet).onclick = function () { Drive.sync('down'); };

  $('#sBackup', sheet).onclick = exportAllJson;
  $('#sRestore', sheet).onclick = importJson;
  $('#sWipe', sheet).onclick = function () {
    confirmBox('모든 데이터를 지울까요?', '이 브라우저에 저장된 모든 공책과 필기가 삭제됩니다. 백업이 없다면 되돌릴 수 없습니다.', '모두 삭제', function () {
      H.DB.wipe().then(function () { location.reload(); });
    }, true);
  };
  renderSettingsIfOpen();
  updateQuota();
}
function closeSheet() {
  if (!sheetEl) return;
  sheetEl.scrim.remove(); sheetEl.sheet.remove();
  sheetEl = null;
}
function renderSettingsIfOpen() {
  if (!sheetEl) return;
  var host = $('#driveStatus', sheetEl.sheet);
  if (!host) return;
  var d = S.drive;
  var cls = d.error ? 'err' : d.token ? 'ok' : '';
  var title = d.error ? '연결 문제' : d.token ? '연결됨' : Drive.hasId() ? '연결 준비됨' : '클라이언트 ID 필요';
  var sub = d.error ? d.error : d.token ? ('토큰 유효 · 만료 ' + H.fmtDate(d.exp)) :
    Drive.hasId() ? '“연결” 을 눌러 구글 계정으로 승인하세요' : '아래에 OAuth 클라이언트 ID 를 붙여넣으세요';
  host.innerHTML = '<div class="status-card ' + cls + '"><svg><use href="#' + (d.error ? 'i-warn' : 'i-cloud') + '"/></svg>' +
    '<span class="grow"><b>' + esc(title) + '</b><em>' + esc(sub) + '</em></span></div>' +
    (d.lastSync ? '<div class="hint">마지막 동기화: ' + H.fmtDate(d.lastSync) + '</div>' : '');
}
function updateQuota() {
  H.DB.estimate().then(function (e) {
    if (!e) { $('#quotaTxt').textContent = '사용량 정보 없음'; return; }
    var used = e.usage || 0, q = e.quota || 0;
    $('#quotaTxt').textContent = H.fmtBytes(used);
    $('#quotaBar').style.width = q ? Math.min(100, used / q * 100).toFixed(1) + '%' : '0%';
    var st = $('#storeStatus');
    if (st) {
      $('#storeTitle', st).textContent = H.DB.isMemory() ? '메모리 모드 (임시)' : '이 브라우저에 저장 중';
      $('#storeSub', st).textContent = H.DB.isMemory()
        ? 'IndexedDB 를 쓸 수 없습니다. 창을 닫으면 필기가 사라집니다 — HTTPS 주소로 열어 주세요.'
        : '사용 ' + H.fmtBytes(used) + (q ? ' / 전체 ' + H.fmtBytes(q) : '');
      if (H.DB.isMemory()) st.classList.add('err');
    }
  });
}

/* ── 키보드 ────────────────────────────────────────────────── */
function isTyping(e) {
  var t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}
function keys(e) {
  if (isTyping(e)) return;
  var mod = e.ctrlKey || e.metaKey;
  var k = e.key;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? H.redo() : H.undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); H.redo(); return; }
  if (mod && k.toLowerCase() === 'a') { e.preventDefault(); setTool('lasso'); H.canvas.selectAll(); return; }
  if (mod && k.toLowerCase() === 'd') { e.preventDefault(); H.canvas.duplicateSel(); return; }
  if (mod && k.toLowerCase() === 's') { e.preventDefault(); exportPdf(); return; }
  if (mod) return;
  switch (k) {
    case 'p': case 'P': setTool('pen'); break;
    case 'h': case 'H': setTool('highlighter'); break;
    case 'e': case 'E': setTool('eraser'); break;
    case 'l': case 'L': setTool('lasso'); break;
    case 't': case 'T': applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); break;
    case 'b': case 'B': toggleTray(); break;
    case 'n': case 'N': addPage(); break;
    case '0': H.canvas.fit(); break;
    case '+': case '=': H.canvas.zoomCenter(1.15); break;
    case '-': case '_': H.canvas.zoomCenter(1 / 1.15); break;
    case '[': setSize(S.prefs.size - 0.6); break;
    case ']': setSize(S.prefs.size + 0.6); break;
    case 'ArrowLeft': case 'PageUp': goPage(S.pageIdx - 1); break;
    case 'ArrowRight': case 'PageDown': goPage(S.pageIdx + 1); break;
    case 'Delete': case 'Backspace':
      if (S.sel.length) { e.preventDefault(); H.canvas.deleteSel(); }
      break;
    case 'Escape':
      if (S.sel.length) H.canvas.clearSel();
      else if (sheetEl) closeSheet();
      else closePops();
      break;
  }
}

/* ── 트레이 토글 ───────────────────────────────────────────── */
function toggleTray() {
  S.prefs.trayHidden = !S.prefs.trayHidden;
  document.body.classList.toggle('tray-hidden', S.prefs.trayHidden);
  H.savePrefs();
  setTimeout(function () { H.canvas.fit(); }, 220);
}
function toggleSide() {
  if (window.innerWidth <= 900) document.body.classList.toggle('side-open');
  else { S.prefs.sideCollapsed = !S.prefs.sideCollapsed; document.body.classList.toggle('side-collapsed', S.prefs.sideCollapsed); H.savePrefs(); }
  setTimeout(function () { H.canvas.fit(); }, 240);
}

/* ── 첫 안내 ───────────────────────────────────────────────── */
function showHint(msg, ms) {
  var h = $('#hint');
  if (!h) return;
  h.innerHTML = msg;
  h.classList.add('show');
  clearTimeout(h._t);
  h._t = setTimeout(function () { h.classList.remove('show'); }, ms || 4200);
}

/* ── 부팅 ─────────────────────────────────────────────────── */
function wireUI() {
  $('#btnTheme').onclick = function () { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
  $('#btnSettings').onclick = openSettings;
  $('#btnSideToggle').onclick = toggleSide;
  $('#btnTrayToggle').onclick = toggleTray;
  $('#btnTrayHide').onclick = toggleTray;
  $('#btnNewNb').onclick = newNotebookDialog;
  $('#btnPgDup').onclick = duplicatePage;
  $('#btnPgDel').onclick = deletePage;
  $('#nbSearch').oninput = H.debounce(renderNbList, 120);
  $('#btnUndo').onclick = H.undo;
  $('#btnRedo').onclick = H.redo;
  $('#btnSync').onclick = function () { Drive.sync('both'); };
  $('#btnClear').onclick = H.canvas.clearPage;
  $('#btnPaper').onclick = function () { paperMenu(this); };
  $('#btnExport').onclick = function () { exportMenu(this); };
  $('#pgPrev').onclick = function () { goPage(S.pageIdx - 1); };
  $('#pgNext').onclick = function () { goPage(S.pageIdx + 1); };
  $('#zIn').onclick = function () { H.canvas.zoomCenter(1.15); };
  $('#zOut').onclick = function () { H.canvas.zoomCenter(1 / 1.15); };
  $('#zFit').onclick = function () { H.canvas.fit(); };
  $('#btnBackup').onclick = exportAllJson;

  $('#nbSwitch').onclick = function () { nbSwitchMenu(this); };

  $$('.tool').forEach(function (b) { b.onclick = function () { setTool(b.dataset.tool); }; });
  $('#penSize').oninput = function () { setSize(this.value); };

  // 드래그앤드롭으로 JSON 가져오기
  ['dragenter', 'dragover'].forEach(function (t) {
    window.addEventListener(t, function (e) { e.preventDefault(); });
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (!/\.json$/i.test(f.name)) { H.toast('JSON 백업 파일만 가져올 수 있습니다', 'err'); return; }
    var dt = new DataTransfer(); dt.items.add(f);
    var inp = document.createElement('input'); inp.type = 'file';
    Object.defineProperty(inp, 'files', { value: dt.files });
    inp.dispatchEvent(new Event('change'));
  });

  window.addEventListener('keydown', keys);
  window.addEventListener('beforeunload', function () { H.savePrefs(); });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && document.body.classList.contains('side-open')) document.body.classList.remove('side-open');
  });
}
function nbSwitchMenu(anchor) {
  var items = S.notebooks.slice(0, 12).map(function (nb) {
    return { icon: 'i-book', label: nb.title, sub: (nb.pageCount || 0) + '쪽 · ' + H.fmtDate(nb.updatedAt || nb.createdAt), run: function () { openNotebook(nb.id); } };
  });
  items.push({ hr: true });
  items.push({ icon: 'i-plus', label: '새 공책', run: newNotebookDialog });
  items.push({ icon: 'i-gear', label: '설정', run: openSettings });
  popover(anchor, { title: '공책', items: items });
}

function boot() {
  applyTheme(S.prefs.theme || 'light');
  document.body.classList.toggle('tray-hidden', !!S.prefs.trayHidden);
  document.body.classList.toggle('side-collapsed', !!S.prefs.sideCollapsed);
  buildSwatches();
  setTool(S.prefs.tool); setColor(S.prefs.color); setSize(S.prefs.size);
  wireUI();
  H.canvas.init();
  // 저장소 로드 전에도 빈 종이가 즉시 보이도록 첫 화면을 먼저 그린다.
  var ph = H.newNotebook('불러오는 중…');
  S.nb = ph; S.pages = [H.newPage(ph.id)]; S.pageIdx = 0;
  renderHeader(); renderTray(); syncPageUI(); H.refreshHistoryUI(); renderNbList();
  H.canvas.rebuildCommit(); H.canvas.fit();
  setTimeout(function () {
    if (!S.nb) H.toast('저장소가 응답하지 않습니다 — 새로 고치거나 HTTPS 주소(배포 주소)로 열어 주세요', 'err', 7000);
  }, 6000);

  H.DB.all('notebooks').then(function (list) {
    S.notebooks = list.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    if (!S.notebooks.length) {
      var nb = H.newNotebook('첫 공책');
      return H.DB.put('notebooks', nb).then(function () { S.notebooks = [nb]; });
    }
  }).then(function () {
    renderNbList();
    var id = (S.prefs.lastNb && S.notebooks.some(function (n) { return n.id === S.prefs.lastNb; })) ? S.prefs.lastNb : (S.notebooks[0] && S.notebooks[0].id);
    if (!id) return;
    return openNotebook(id).then(function () {
      syncPageUI();
      if (S.prefs.showHint) {
        S.prefs.showHint = false; H.savePrefs();
        showHint('펜으로 바로 쓰세요 · <kbd>P</kbd> 펜 <kbd>E</kbd> 지우개 <kbd>Ctrl+Z</kbd> 되돌리기 · 두 손가락으로 이동/확대', 7000);
      }
      updateQuota();
    });
  }).catch(function (e) {
    console.error(e);
    H.toast('시작 중 문제가 발생했습니다: ' + e.message, 'err', 5000);
  });

  if (H.DB.isMemory()) setTimeout(function () { H.toast('IndexedDB 를 쓸 수 없어 임시 모드입니다 — HTTPS 주소로 열어 주세요', 'err', 6000); }, 1200);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { });
    });
  }
  if (window.matchMedia) {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (S.prefs.theme === 'auto') applyTheme('auto');
    });
  }
}
H.confirmBox = confirmBox;
H.promptBox = promptBox;
H.syncPageUI = syncPageUI;
H.updateQuota = updateQuota;
H.openNotebook = openNotebook;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
