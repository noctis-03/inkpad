<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="sky"><style>
  .pet{animation:bob 3.2s ease-in-out 1.48s infinite;transform-origin:60px 110px}
  .eye{animation:blink 4.8s 1.48s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){.pet,.eye{animation:none}}
</style><g class="pet"><rect x="18" y="10" width="84" height="102" rx="36" fill="#1E8BFF" transform="rotate(12 60 61)"/><g class="eyes"><circle class="eye" cx="44" cy="56" r="9" fill="#fff"/><circle class="eye" cx="68" cy="56" r="9" fill="#fff"/></g></g></svg>
