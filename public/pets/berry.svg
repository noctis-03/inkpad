<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="berry"><style>
  .pet{animation:bob 3.2s ease-in-out 2.2199999999999998s infinite;transform-origin:60px 110px}
  .eye{animation:blink 4.8s 2.2199999999999998s infinite;transform-box:fill-box;transform-origin:center}
