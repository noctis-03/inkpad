  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){.pet,.eye{animation:none}}
</style><g class="pet"><path d="M60 12C68 12 74 18 80 28L110 84C118 100 106 112 90 112H30C14 112 2 100 10 84L40 28C46 18 52 12 60 12Z" fill="#FF2F92"/><g class="eyes"><g transform="rotate(0 54 70)"><rect class="eye" x="50.5" y="64" width="7" height="12" rx="3.5" fill="#fff"/></g><g transform="rotate(0 68 70)"><rect class="eye" x="64.5" y="64" width="7" height="12" rx="3.5" fill="#fff"/></g></g></g></svg>
