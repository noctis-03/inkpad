<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ink"><style>
  .pet{animation:bob 3.2s ease-in-out 0.37s infinite;transform-origin:60px 110px}
  .eye{animation:blink 4.8s 0.37s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){.pet,.eye{animation:none}}
</style><g class="pet"><circle cx="60" cy="62" r="50" fill="#111111"/><g class="eyes"><g transform="rotate(15 56 44)"><rect class="eye" x="51.5" y="33" width="9" height="22" rx="4.5" fill="#fff"/></g><g transform="rotate(15 76 44)"><rect class="eye" x="71.5" y="33" width="9" height="22" rx="4.5" fill="#fff"/></g></g></g></svg>
