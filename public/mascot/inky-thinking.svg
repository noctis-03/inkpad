<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Inky is thinking">
  <style>
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
    .d2{animation-delay:.15s}.d3{animation-delay:.3s}
    @keyframes pulse{0%,60%,100%{transform:scale(.6);opacity:.45}30%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
  <path d="M128 26C128 26 58 104 58 158a70 70 0 0 0 140 0C198 104 128 26 128 26Z" fill="#2f62e0"/>
  <path d="M84 150c2-22 16-46 30-64" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".28"/>
  <circle class="dot" cx="100" cy="166" r="11" fill="#f7f6f2"/>
  <circle class="dot d2" cx="128" cy="166" r="11" fill="#f7f6f2"/>
  <circle class="dot d3" cx="156" cy="166" r="11" fill="#f7f6f2"/>
</svg>
